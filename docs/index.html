<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>换电运营平台 · 真实数据看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  :root {
    --bg-0: #070f1d;
    --bg-1: #0b1830;
    --panel: rgba(16, 35, 68, .72);
    --panel-border: rgba(64, 128, 255, .22);
    --accent: #38bdf8;
    --accent-2: #2563eb;
    --green: #34d399;
    --orange: #fbbf24;
    --red: #f87171;
    --text: #e2e8f0;
    --text-dim: #8aa3c4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(37, 99, 235, .28), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(56, 189, 248, .16), transparent 55%),
      linear-gradient(160deg, var(--bg-0), var(--bg-1) 55%, #0a1428);
    background-attachment: fixed;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    padding: 16px 22px 10px;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 {
    font-size: 24px; font-weight: 700; letter-spacing: 2px;
    background: linear-gradient(90deg, #7dd3fc, #60a5fa, #38bdf8);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .brand .sub { font-size: 12px; letter-spacing: 4px; color: var(--text-dim); }
  .top-meta { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--text-dim); }
  .top-meta .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .top-meta .badge { border: 1px solid var(--panel-border); background: rgba(56,189,248,.12); color: #7dd3fc; padding: 3px 10px; border-radius: 20px; }

  .container { padding: 8px 22px 26px; max-width: 1760px; margin: 0 auto; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 14px; }
  .kpi {
    position: relative; overflow: hidden;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    padding: 16px 18px; backdrop-filter: blur(6px);
  }
  .kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
  .kpi.k2::before { background: var(--accent-2); }
  .kpi.k3::before { background: var(--green); }
  .kpi.k4::before { background: var(--orange); }
  .kpi.k5::before { background: #a78bfa; }
  .kpi.k6::before { background: #f472b6; }
  .kpi .label { font-size: 13px; color: var(--text-dim); }
  .kpi .value { font-size: 30px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: .5px; }
  .kpi .value .unit { font-size: 14px; font-weight: 400; color: var(--text-dim); margin-left: 4px; }
  .kpi .trend { font-size: 12px; margin-top: 8px; color: var(--text-dim); }
  .kpi .trend .up { color: var(--green); }
  .kpi .trend .down { color: var(--red); }

  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; margin-bottom: 14px; }
  .panel {
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px;
    padding: 14px 16px; backdrop-filter: blur(6px); min-width: 0;
  }
  .panel .p-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; margin-bottom: 10px; color: #dbeafe; }
  .panel .p-title::before { content: ""; width: 4px; height: 14px; background: var(--accent); border-radius: 2px; }
  .panel .p-sub { font-size: 12px; color: var(--text-dim); font-weight: 400; margin-left: auto; }
  .chart { width: 100%; height: 300px; }
  .col-4 { grid-column: span 4; }
  .col-5 { grid-column: span 5; }
  .col-6 { grid-column: span 6; }
  .col-7 { grid-column: span 7; }
  .col-12 { grid-column: span 12; }

  .risk-list { list-style: none; }
  .risk-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 8px; border-bottom: 1px dashed rgba(148,163,184,.18); font-size: 13px;
  }
  .risk-item:last-child { border-bottom: none; }
  .risk-lv { flex: none; padding: 2px 9px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .lv-p0 { background: rgba(248,113,113,.16); color: #f87171; }
  .lv-p1 { background: rgba(251,191,36,.16); color: #fbbf24; }
  .lv-p2 { background: rgba(96,165,250,.16); color: #93c5fd; }
  .risk-name { flex: 1; color: #dbeafe; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .risk-time { flex: none; color: var(--text-dim); font-size: 12px; }

  .foot { text-align: center; color: #50688a; font-size: 12px; padding: 6px 0 18px; letter-spacing: 1px; }

  @media (max-width: 1400px) {
    .col-4, .col-5, .col-6, .col-7 { grid-column: span 6; }
  }
  @media (max-width: 900px) {
    .col-4, .col-5, .col-6, .col-7 { grid-column: span 12; }
    .chart { height: 260px; }
    .brand h1 { font-size: 19px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <h1>换电运营平台</h1>
    <span class="sub">BATTERY-SWAP OPERATIONS</span>
  </div>
  <div class="top-meta">
    <span class="badge">真实业务数据快照 · 已脱敏</span>
    <span class="dot"></span>
    <span id="now"></span>
  </div>
</div>

<div class="container">

  <div class="kpi-grid" id="kpiGrid"></div>

  <div class="grid">
    <div class="panel col-7">
      <div class="p-title">运营趋势<span class="p-sub">近 12 个月换电次数与营收</span></div>
      <div id="chartTrend" class="chart"></div>
    </div>
    <div class="panel col-5">
      <div class="p-title">用户增长<span class="p-sub">近 6 个月新增用户</span></div>
      <div id="chartUser" class="chart"></div>
    </div>
  </div>

  <div class="grid">
    <div class="panel col-4">
      <div class="p-title">设备资产状态<span class="p-sub">换电柜与电池在线/离线</span></div>
      <div id="chartDevice" class="chart"></div>
    </div>
    <div class="panel col-4">
      <div class="p-title">城市运营排行<span class="p-sub">近 30 天换电次数 TOP5</span></div>
      <div id="chartRegion" class="chart"></div>
    </div>
    <div class="panel col-4">
      <div class="p-title">财务收支趋势<span class="p-sub">近 12 个月营收与毛利</span></div>
      <div id="chartFinance" class="chart"></div>
    </div>
  </div>

  <div class="grid">
    <div class="panel col-12">
      <div class="p-title">实时告警统计<span class="p-sub">当前检测到的设备异常</span></div>
      <ul class="risk-list" id="riskList"></ul>
    </div>
  </div>

  <div class="foot">BATTERY-SWAP DASHBOARD · 真实业务聚合数据（脱敏快照） · 数据截至 2026-09-10</div>
</div>

<script>
var AXIS_COLOR = "#8aa3c4";
var SPLIT_COLOR = "rgba(148,163,184,.14)";
function baseTooltip() { return { trigger: "axis", backgroundColor: "rgba(9,20,42,.9)", borderColor: "rgba(64,128,255,.4)", textStyle: { color: "#e2e8f0", fontSize: 12 } }; }
function baseLegend() { return { textStyle: { color: AXIS_COLOR, fontSize: 12 }, top: 0, right: 0 }; }
function fmt(n) {
  if (n == null) return "-";
  n = Number(n);
  if (Math.abs(n) >= 100000000) return (n / 100000000).toFixed(2) + "亿";
  if (Math.abs(n) >= 10000) return (n / 10000).toFixed(1) + "万";
  return String(Math.round(n * 100) / 100);
}
function fmtMoney(n) {
  if (n == null) return "-";
  n = Number(n);
  if (Math.abs(n) >= 100000000) return (n / 100000000).toFixed(2) + "亿";
  if (Math.abs(n) >= 10000) return (n / 10000).toFixed(1) + "万";
  return String(Math.round(n * 100) / 100);
}

/* ===== 数据加载 ===== */
var FILES = [
  "data/api_overview_summary.json",
  "data/api_overview_device-dimension.json",
  "data/api_bigscreen_trend.json",
  "data/api_users_growth.json",
  "data/api_bigscreen_top-cities.json",
  "data/api_finance_income-trend.json",
  "data/api_dashboard_alarm-stats.json"
];
var D = {};
var tasks = FILES.map(function (f) {
  return fetch(f).then(function (r) { return r.json(); }).then(function (j) {
    var k = f.split("/").pop().replace(/\.json$/, "");
    D[k] = j.data || j;
  }).catch(function () { D[f.split("/").pop()] = null; });
});

Promise.all(tasks).then(function () {

  var ov = D.api_overview_summary || {};
  var dev = D["api_overview_device-dimension"] || {};
  var online = (dev.battery ? dev.battery.online : 0) + (dev.exchange ? dev.exchange.online : 0);
  var KPIS = [
    { label: "累计注册用户", value: fmt(ov.total_users), unit: "人", trend: "今日新增 " + (ov.today_new_users || 0), up: true, cls: "" },
    { label: "今日换电次数", value: fmt(ov.today_exchange), unit: "次", trend: "昨日 " + fmt(ov.yesterday_exchange), up: true, cls: "k2" },
    { label: "今日营收", value: fmtMoney(ov.today_fee), unit: "元", trend: "实时统计", up: true, cls: "k4" },
    { label: "在线设备", value: fmt(online), unit: "台", trend: "电池 " + fmt(dev.battery ? dev.battery.online : 0) + " / 柜 " + fmt(dev.exchange ? dev.exchange.online : 0), up: true, cls: "k3" },
    { label: "电池总数", value: fmt(dev.battery ? dev.battery.total : 0), unit: "块", trend: "在线率 " + (dev.battery && dev.battery.total ? (dev.battery.online / dev.battery.total * 100).toFixed(1) : "-") + "%", up: true, cls: "k5" },
    { label: "营业网点", value: fmt(dev.site ? dev.site.total : 0), unit: "个", trend: "营业中 " + fmt(dev.site ? dev.site.open : 0), up: true, cls: "k6" }
  ];
  var html = "";
  KPIS.forEach(function (k, i) {
    var cls = k.cls ? (" kpi " + k.cls) : " kpi";
    var arrow = k.up ? '<span class="up">▲ ' + k.trend + '</span>' : '<span class="down">▼ ' + k.trend + '</span>';
    html += '<div class="' + cls + '"><div class="label">' + k.label + '</div><div class="value">' + k.value + '<span class="unit">' + k.unit + '</span></div><div class="trend">' + arrow + '</div></div>';
  });
  document.getElementById("kpiGrid").innerHTML = html;

  var trend = D.api_bigscreen_trend || [];
  var months = trend.map(function (t) { return t.month; });
  var cnts = trend.map(function (t) { return t.exchange_count; });
  var fees = trend.map(function (t) { return Math.round(t.fee / 10000 * 100) / 100; });
  chartTrend(months, cnts, fees);

  var growth = D.api_users_growth || {};
  var gTrend = growth.trend || [];
  chartUser(gTrend.map(function (t) { return t.month; }), gTrend.map(function (t) { return t.cnt; }));

  chartDevice(dev);

  var cities = D["api_bigscreen_top-cities"] || [];
  chartRegion(cities);

  var fin = D["api_finance_income-trend"] || [];
  chartFinance(fin.map(function (t) { return t.month; }), fin.map(function (t) { return Math.round(t.income / 10000 * 100) / 100; }), fin.map(function (t) { return Math.round(t.profit / 10000 * 100) / 100; }));

  var alarm = D["api_dashboard_alarm-stats"] || {};
  renderRisks(alarm);
}).catch(function (e) {
  document.getElementById("kpiGrid").innerHTML = '<div style="color:#f87171;padding:20px;">数据加载失败：' + e.message + '</div>';
});

function chartTrend(m, c, f) {
  var el = document.getElementById("chartTrend");
  var chart = echarts.init(el);
  chart.setOption({
    tooltip: baseTooltip(),
    legend: baseLegend(),
    grid: { left: 48, right: 56, top: 34, bottom: 26 },
    xAxis: { type: "category", data: m, axisLine: { lineStyle: { color: SPLIT_COLOR } }, axisLabel: { color: AXIS_COLOR, fontSize: 10, interval: 1 } },
    yAxis: [
      { type: "value", name: "换电次数", nameTextStyle: { color: AXIS_COLOR }, splitLine: { lineStyle: { color: SPLIT_COLOR } }, axisLabel: { color: AXIS_COLOR, fontSize: 11 } },
      { type: "value", name: "营收(万)", nameTextStyle: { color: AXIS_COLOR }, splitLine: { show: false }, axisLabel: { color: AXIS_COLOR, fontSize: 11 } }
    ],
    series: [
      { name: "换电次数", type: "line", data: c, smooth: true, symbol: "none", lineStyle: { width: 2, color: "#38bdf8" }, areaStyle: { color: { type: "linear", x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: "rgba(56,189,248,.32)" }, { offset: 1, color: "rgba(56,189,248,0)" }] } } },
      { name: "营收(万)", type: "line", yAxisIndex: 1, data: f, smooth: true, symbol: "none", lineStyle: { width: 2, color: "#fbbf24" } }
    ]
  });
  window.addEventListener("resize", function () { chart.resize(); });
}

function chartUser(m, c) {
  var el = document.getElementById("chartUser");
  var chart = echarts.init(el);
  chart.setOption({
    tooltip: baseTooltip(),
    grid: { left: 44, right: 30, top: 24, bottom: 26 },
    xAxis: { type: "category", data: m, axisLine: { lineStyle: { color: SPLIT_COLOR } }, axisLabel: { color: AXIS_COLOR, fontSize: 10, interval: 0 } },
    yAxis: { type: "value", splitLine: { lineStyle: { color: SPLIT_COLOR } }, axisLabel: { color: AXIS_COLOR, fontSize: 11 } },
    series: [{
      name: "新增用户", type: "bar", data: c, barWidth: "46%",
      itemStyle: { color: { type: "linear", x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: "#60a5fa" }, { offset: 1, color: "#1d4ed8" }] }, borderRadius: [3, 3, 0, 0] },
      label: { show: true, position: "top", color: "#dbeafe", fontSize: 11 }
    }]
  });
  window.addEventListener("resize", function () { chart.resize(); });
}

function chartDevice(dev) {
  var el = document.getElementById("chartDevice");
  var chart = echarts.init(el);
  var ex = dev.exchange || {}, ba = dev.battery || {};
  chart.setOption({
    tooltip: { trigger: "item", backgroundColor: "rgba(9,20,42,.9)", borderColor: "rgba(64,128,255,.4)", textStyle: { color: "#e2e8f0", fontSize: 12 }, formatter: "{b}: {c} ({d}%)" },
    legend: { bottom: 0, textStyle: { color: AXIS_COLOR, fontSize: 11 } },
    series: [
      {
        name: "换电柜", type: "pie", radius: ["18%", "38%"], center: ["28%", "44%"],
        label: { color: AXIS_COLOR, fontSize: 10, formatter: "{b} {d}%" },
        data: [
          { name: "在线", value: ex.online || 0 },
          { name: "离线", value: ex.offline || 0 }
        ],
        color: ["#38bdf8", "#f87171"],
        itemStyle: { borderColor: "#0b1830", borderWidth: 2 }
      },
      {
        name: "电池", type: "pie", radius: ["18%", "38%"], center: ["74%", "44%"],
        label: { color: AXIS_COLOR, fontSize: 10, formatter: "{b} {d}%" },
        data: [
          { name: "在线", value: ba.online || 0 },
          { name: "离线", value: ba.offline || 0 }
        ],
        color: ["#34d399", "#f87171"],
        itemStyle: { borderColor: "#0b1830", borderWidth: 2 }
      }
    ]
  });
  window.addEventListener("resize", function () { chart.resize(); });
}

function chartRegion(cities) {
  var el = document.getElementById("chartRegion");
  var chart = echarts.init(el);
  var names = cities.map(function (c) { return c.city.replace(/省|市|壮族自治区|自治区/g, ""); }).reverse();
  var vals = cities.map(function (c) { return c.orders; }).reverse();
  chart.setOption({
    tooltip: baseTooltip(),
    grid: { left: 64, right: 40, top: 20, bottom: 24 },
    xAxis: { type: "value", splitLine: { lineStyle: { color: SPLIT_COLOR } }, axisLabel: { color: AXIS_COLOR, fontSize: 11 } },
    yAxis: { type: "category", data: names, axisLine: { lineStyle: { color: SPLIT_COLOR } }, axisLabel: { color: AXIS_COLOR, fontSize: 11 } },
    series: [{
      type: "bar", data: vals, barWidth: 14,
      itemStyle: { color: { type: "linear", x: 0, y: 0, x2: 1, y2: 0, colorStops: [{ offset: 0, color: "#1d4ed8" }, { offset: 1, color: "#38bdf8" }] }, borderRadius: [0, 6, 6, 0] },
      label: { show: true, position: "right", color: "#dbeafe", fontSize: 11, formatter: function (p) { return fmt(p.value); } }
    }]
  });
  window.addEventListener("resize", function () { chart.resize(); });
}

function chartFinance(m, income, profit) {
  var el = document.getElementById("chartFinance");
  var chart = echarts.init(el);
  chart.setOption({
    tooltip: baseTooltip(),
    legend: baseLegend(),
    grid: { left: 48, right: 40, top: 34, bottom: 26 },
    xAxis: { type: "category", data: m, axisLine: { lineStyle: { color: SPLIT_COLOR } }, axisLabel: { color: AXIS_COLOR, fontSize: 9, interval: 1 } },
    yAxis: { type: "value", name: "万元", nameTextStyle: { color: AXIS_COLOR }, splitLine: { lineStyle: { color: SPLIT_COLOR } }, axisLabel: { color: AXIS_COLOR, fontSize: 10 } },
    series: [
      { name: "营收", type: "bar", data: income, barWidth: "38%", itemStyle: { color: { type: "linear", x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: "#60a5fa" }, { offset: 1, color: "#1d4ed8" }] }, borderRadius: [3, 3, 0, 0] } },
      { name: "毛利", type: "line", data: profit, smooth: true, symbol: "circle", symbolSize: 5, lineStyle: { width: 2, color: "#34d399" }, itemStyle: { color: "#34d399" } }
    ]
  });
  window.addEventListener("resize", function () { chart.resize(); });
}

function renderRisks(alarm) {
  var items = [];
  var ba = alarm.battery || {}, ex = alarm.exchange || {};
  var defs = [
    { lv: "P0", cls: "lv-p0", name: "电池低电量（hungry）告警", cnt: ba.hungry, time: "电池类" },
    { lv: "P0", cls: "lv-p0", name: "换电柜水浸告警", cnt: ex.flooded, time: "换电柜类" },
    { lv: "P1", cls: "lv-p1", name: "电池异常充电（break_charge）告警", cnt: ba.break_charge, time: "电池类" },
    { lv: "P1", cls: "lv-p1", name: "电池未识别告警", cnt: ba.unrecognized, time: "电池类" },
    { lv: "P1", cls: "lv-p1", name: "换电柜烟感告警", cnt: ex.smoke, time: "换电柜类" },
    { lv: "P1", cls: "lv-p1", name: "换电柜仓门/卡槽异常告警", cnt: ex.slot, time: "换电柜类" }
  ];
  defs.forEach(function (d) {
    if (d.cnt != null && d.cnt > 0) items.push(d);
  });
  var html = "";
  items.forEach(function (r) {
    html += '<li class="risk-item"><span class="risk-lv ' + r.cls + '">' + r.lv + '</span><span class="risk-name">' + r.name + '</span><span class="risk-time">' + fmt(r.cnt) + ' 起 · ' + r.time + '</span></li>';
  });
  if (!html) html = '<li class="risk-item"><span class="risk-name">当前无告警</span></li>';
  document.getElementById("riskList").innerHTML = html;
}

function tick() {
  var d = new Date();
  var p = function (n) { return (n < 10 ? "0" : "") + n; };
  document.getElementById("now").textContent = d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
setInterval(tick, 1000); tick();
</script>
</body>
</html>
