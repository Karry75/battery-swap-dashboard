<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>换电运营平台 · 数据快照</title>
<meta name="description" content="换电运营平台看板（静态快照版）：设备、用户、销售、网点、资产、财务、告警等全板块展示，数据为脱敏快照，不依赖后端与数据库。">
<link rel="stylesheet" href="css/style.css?v=20260926">

<style>
.public-notice{background:#0b2545;color:#cfe3ff;font-size:12px;line-height:1.6;padding:7px 14px;border-bottom:1px solid #12335c}
.side-toggle{display:none}
.topbar-left{display:flex;align-items:center;gap:10px;min-width:0}
.side-mask{display:none}
@media (max-width:900px){
  .side-toggle{display:inline-block;background:#12294a;color:#dbe9ff;border:1px solid #24456f;border-radius:6px;padding:4px 10px;font-size:16px;line-height:1;flex:none}
  .layout .sidebar{position:fixed;left:0;top:0;bottom:0;width:230px;transform:translateX(-100%);transition:transform .2s;z-index:60;overflow-y:auto}
  body.side-open .layout .sidebar{transform:none}
  .side-mask{position:fixed;inset:0;background:rgba(4,12,24,.45);z-index:55}
  body.side-open .side-mask{display:block}
  .layout .main{padding-left:0}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .table-wrap{overflow-x:auto}
  /* 手机端：宽表格在卡片内部横向滚动，避免整页被撑宽导致页面被缩放到看不清 */
  .content table{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .content canvas,.content img{max-width:100%}
  .content{padding-left:10px;padding-right:10px}
  .topbar{padding-left:12px;padding-right:12px}
}
</style>
</head>
<body>
<div class="layout">
  <div class="side-mask" id="sideMask"></div>
  <!-- 左侧菜单 -->
  <aside class="sidebar">
    <div class="side-brand">
      <div class="brand-title">换电运营平台</div>
      <div class="brand-sub">OPERATION PLATFORM</div>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">
      <div class="user-mini" id="userMini"></div>
    </div>
  </aside>

  <!-- 主区 -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="side-toggle" id="sideToggle" type="button" aria-label="展开/收起菜单">☰</button>
        <div class="breadcrumb" id="breadcrumb">运维看板</div>
      </div>
      <div class="topbar-right">
        <div class="user-menu" id="userMenuWrap">
          <button class="btn btn-user" id="btnUserMenu"></button>
          <div class="dropdown" id="userDropdown" style="display:none">
            <div class="dropdown-item disabled" id="dropRole"></div>
            <div class="dropdown-item" id="dropAdmin" style="display:none">用户管理</div>
            <div class="dropdown-item" id="dropRoleAdmin" style="display:none">角色管理</div>
            <div class="dropdown-item danger" id="dropLogout">退出登录</div>
          </div>
        </div>
      </div>
    </header>

    <main class="content" id="content">
      <div id="connBanner" class="banner banner-error" style="display:none"></div>
      <div id="page"></div>
    </main>
  </div>
</div>

<!-- 用户管理弹窗（静态版默认隐藏入口） -->
<div id="adminModal" class="modal-mask" style="display:none">
  <div class="modal">
    <div class="modal-head"><h3>用户管理</h3><button class="btn btn-ghost-dark" onclick="closeAdmin()">关闭</button></div>
    <form id="userForm" class="modal-form">
      <input type="hidden" id="u_id">
      <input type="text" id="u_username" placeholder="用户名" required>
      <input type="password" id="u_password" placeholder="密码（修改时留空则不修改，新建必填）">
      <select id="u_role">
        <option value="viewer">查看者</option>
        <option value="manager">客户经理</option>
        <option value="admin">管理员</option>
      </select>
      <input type="text" id="u_oem_ids" placeholder="客户ID（逗号分隔，仅客户经理生效）">
      <input type="text" id="u_display_name" placeholder="显示名称">
      <button type="submit" class="btn btn-primary">保存</button>
    </form>
    <table id="adminUserTable" class="table">
      <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>客户范围</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- 角色管理弹窗（静态版默认隐藏入口） -->
<div id="roleModal" class="modal-mask" style="display:none">
  <div class="modal modal-lg">
    <div class="modal-head"><h3>角色管理</h3><button class="btn btn-ghost-dark" onclick="closeRole()">关闭</button></div>
    <div class="role-create">
      <input type="text" id="r_key" class="input" placeholder="角色标识（英文，如 city_manager）">
      <input type="text" id="r_name" class="input" placeholder="角色名称（如 城市经理）">
      <button class="btn btn-primary" onclick="createRole()">新增角色</button>
      <span class="muted">创建后可在下方为该角色勾选可查看的模块菜单</span>
    </div>
    <div id="roleList"></div>
  </div>
</div>


<script>
document.addEventListener('DOMContentLoaded', function(){
  var t = document.getElementById('sideToggle');
  var close = function(){ document.body.classList.remove('side-open'); };
  if (t) t.addEventListener('click', function(e){ e.stopPropagation(); document.body.classList.toggle('side-open'); });
  var m = document.getElementById('sideMask');
  if (m) m.addEventListener('click', close);
  var nav = document.getElementById('sideNav');
  if (nav) nav.addEventListener('click', function(e){
    if (e.target.closest('.menu-item')) close();
  });
  /* 手机端：点击主区内容也收起菜单 */
  var main = document.querySelector('.main');
  if (main) main.addEventListener('click', function(){ if (window.innerWidth <= 900) close(); });
});
</script>
<script src="lib/echarts.min.js"></script>
<script src="js/static-shim.js?v=20260926"></script>
<script src="js/app.js?v=20260926"></script>
</body>
</html>
