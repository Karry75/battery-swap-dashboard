<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>换电运营平台 · 完整看板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  :root {
    --bg-0: #070f1d; --bg-1: #0b1830; --panel: rgba(16,35,68,.72);
    --panel-border: rgba(64,128,255,.22); --accent: #38bdf8; --accent-2: #2563eb;
    --green: #34d399; --orange: #fbbf24; --red: #f87171; --text: #e2e8f0; --text-dim: #8aa3c4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
    color: var(--text); background:
      radial-gradient(1200px 600px at 15% -10%, rgba(37,99,235,.28), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(56,189,248,.16), transparent 55%),
      linear-gradient(160deg, var(--bg-0), var(--bg-1) 55%, #0a1428);
    background-attachment: fixed; min-height: 100vh; overflow-x: hidden;
  }
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 224px; flex: none; background: rgba(7,15,29,.82); border-right: 1px solid var(--panel-border);
    padding: 14px 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .side-brand { padding: 4px 10px 14px; }
  .side-brand h1 { font-size: 17px; font-weight: 700; letter-spacing: 1px; background: linear-gradient(90deg,#7dd3fc,#60a5fa,#38bdf8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .side-brand .sub { font-size: 10px; letter-spacing: 3px; color: var(--text-dim); }
  .menu-group { margin-top: 4px; }
  .menu-group-title { font-size: 11px; color: #5b739a; padding: 10px 10px 4px; letter-spacing: 2px; }
  .menu-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin: 1px 0;
    border-radius: 8px; cursor: pointer; font-size: 13px; color: #b7c7e2; transition: all .15s;
  }
  .menu-item:hover { background: rgba(56,189,248,.1); color: #e2e8f0; }
  .menu-item.active { background: linear-gradient(90deg, rgba(37,99,235,.35), rgba(56,189,248,.12)); color: #7dd3fc; border-left: 3px solid var(--accent); }
  .menu-item .icon { font-size: 14px; width: 18px; text-align: center; }
  .main { flex: 1; min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 16px 22px 10px; }
  .top-meta { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--text-dim); }
  .top-meta .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .top-meta .badge { border: 1px solid var(--panel-border); background: rgba(56,189,248,.12); color: #7dd3fc; padding: 3px 10px; border-radius: 20px; }
  .page-title { font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #dbeafe; }
  .page-title .sub { font-size: 12px; color: var(--text-dim); font-weight: 400; margin-left: 10px; }
  .container { padding: 8px 22px 26px; max-width: 1760px; }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(205px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .kpi { position: relative; overflow: hidden; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 14px 16px; }
  .kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
  .kpi.k2::before { background: var(--accent-2); } .kpi.k3::before { background: var(--green); }
  .kpi.k4::before { background: var(--orange); } .kpi.k5::before { background: #a78bfa; } .kpi.k6::before { background: #f472b6; }
  .kpi .label { font-size: 12px; color: var(--text-dim); }
  .kpi .value { font-size: 26px; font-weight: 700; margin-top: 5px; font-variant-numeric: tabular-nums; }
  .kpi .value .unit { font-size: 13px; font-weight: 400; color: var(--text-dim); margin-left: 4px; }
  .kpi .trend { font-size: 11px; margin-top: 6px; color: var(--text-dim); }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; margin-bottom: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; padding: 13px 15px; min-width: 0; }
  .panel .p-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; margin-bottom: 9px; color: #dbeafe; }
  .panel .p-title::before { content: ""; width: 4px; height: 13px; background: var(--accent); border-radius: 2px; }
  .panel .p-sub { font-size: 11px; color: var(--text-dim); font-weight: 400; margin-left: auto; }
  .chart { width: 100%; height: 290px; }
  .chart-sm { width: 100%; height: 240px; }
  .col-4 { grid-column: span 4; } .col-5 { grid-column: span 5; } .col-6 { grid-column: span 6; }
  .col-7 { grid-column: span 7; } .col-8 { grid-column: span 8; } .col-12 { grid-column: span 12; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.tbl th { text-align: left; color: #7dd3fc; font-weight: 600; padding: 7px 8px; border-bottom: 1px solid rgba(64,128,255,.28); white-space: nowrap; }
  table.tbl td { padding: 6px 8px; border-bottom: 1px solid rgba(148,163,184,.12); color: #c7d5ea; font-variant-numeric: tabular-nums; }
  table.tbl tr:hover td { background: rgba(56,189,248,.06); }
  .scroll-tbl { max-height: 320px; overflow-y: auto; }
  .risk-list { list-style: none; }
  .risk-item { display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-bottom: 1px dashed rgba(148,163,184,.18); font-size: 13px; }
  .risk-item:last-child { border-bottom: none; }
  .risk-lv { flex: none; padding: 2px 9px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .lv-p0 { background: rgba(248,113,113,.16); color: #f87171; }
  .lv-p1 { background: rgba(251,191,36,.16); color: #fbbf24; }
  .lv-p2 { background: rgba(96,165,250,.16); color: #93c5fd; }
  .risk-name { flex: 1; color: #dbeafe; }
  .risk-time { flex: none; color: var(--text-dim); font-size: 12px; }
  .placeholder { background: var(--panel); border: 1px dashed rgba(64,128,255,.3); border-radius: 12px; padding: 42px 20px; text-align: center; color: var(--text-dim); font-size: 13px; line-height: 2; }
  .placeholder .big { font-size: 30px; margin-bottom: 8px; }
  .foot { text-align: center; color: #50688a; font-size: 12px; padding: 6px 0 18px; letter-spacing: 1px; }
  @media (max-width: 1200px) { .col-4,.col-5,.col-6,.col-7,.col-8 { grid-column: span 6; } }
  @media (max-width: 800px) { .sidebar { width: 60px; } .menu-item span.txt, .menu-group-title { display: none; } .col-4,.col-5,.col-6,.col-7,.col-8 { grid-column: span 12; } }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="side-brand"><h1>换电运营平台</h1><div class="sub">BATTERY-SWAP OPS</div></div>
    <nav id="menu"></nav>
  </aside>
  <div class="main">
    <div class="topbar">
      <div class="page-title" id="pageTitle">数据大屏<span class="sub" id="pageSub"></span></div>
      <div class="top-meta">
        <span class="badge">真实业务数据快照 · 已脱敏</span>
        <span class="dot"></span>
        <span id="now"></span>
      </div>
    </div>
    <div class="container" id="content"></div>
    <div class="foot">BATTERY-SWAP DASHBOARD · 真实业务聚合数据（脱敏快照） · 数据截至 2026-09-10</div>
  </div>
</div>

<script>
/* ================= 工具 ================= */
var AXIS_COLOR = "#8aa3c4", SPLIT = "rgba(148,163,184,.14)";
function $id(id) { return document.getElementById(id); }
function fmt(n) {
  if (n == null) return "-"; n = Number(n);
  if (Math.abs(n) >= 100000000) return (n / 100000000).toFixed(2) + "亿";
  if (Math.abs(n) >= 10000) return (n / 10000).toFixed(1) + "万";
  return String(Math.round(n * 100) / 100);
}
function fmtMoney(n) { return fmt(n); }
function pct(a, b) { return b ? (Number(a) / Number(b) * 100).toFixed(1) + "%" : "-"; }
function baseTooltip() { return { trigger: "axis", backgroundColor: "rgba(9,20,42,.9)", borderColor: "rgba(64,128,255,.4)", textStyle: { color: "#e2e8f0", fontSize: 12 } }; }
function baseLegend() { return { textStyle: { color: AXIS_COLOR, fontSize: 12 }, top: 0, right: 0 }; }
var _charts = [];
function mkChart(el, option) {
  var chart = echarts.init(el);
  chart.setOption(option);
  _charts.push(chart);
  return chart;
}
function kpiHTML(items) {
  var html = "";
  items.forEach(function (k) {
    var cls = k.cls ? (" kpi " + k.cls) : " kpi";
    var trend = k.trend != null ? '<div class="trend">' + k.trend + '</div>' : "";
    html += '<div class="' + cls + '"><div class="label">' + k.label + '</div><div class="value">' + k.value + '<span class="unit">' + (k.unit || "") + '</span></div>' + trend + '</div>';
  });
  return html;
}
function tableHTML(headers, rows, empty) {
  if (!rows || !rows.length) return '<div class="placeholder"><div class="big">📭</div>' + (empty || "暂无数据") + '</div>';
  var h = "<thead><tr>" + headers.map(function (x) { return "<th>" + x + "</th>"; }).join("") + "</tr></thead>";
  var b = "<tbody>" + rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody>";
  return '<table class="tbl">' + h + b + "</table>";
}
function panel(title, sub, body, col) {
  return '<div class="panel ' + (col || "col-12") + '"><div class="p-title">' + title + '<span class="p-sub">' + (sub || "") + '</span></div>' + body + '</div>';
}
function chartPanel(title, sub, id, cls) {
  return panel(title, sub, '<div id="' + id + '" class="' + (cls || "chart") + '"></div>', "col-6");
}
function placeholderHTML(text) {
  return '<div class="placeholder"><div class="big">🔒</div>' + text + '</div>';
}
function lineOpt(x, series, yNames) {
  var s = series.map(function (s, i) {
    var colors = ["#38bdf8", "#fbbf24", "#34d399", "#a78bfa"];
    var obj = { name: s.name, type: "line", data: s.data, smooth: true, symbol: "none", lineStyle: { width: 2, color: colors[i] } };
    if (yNames && yNames[i]) obj.yAxisIndex = i;
    return obj;
  });
  var yAxis = yNames ? yNames.map(function (n, i) {
    return { type: "value", name: n, nameTextStyle: { color: AXIS_COLOR }, splitLine: { lineStyle: { color: SPLIT } }, axisLabel: { color: AXIS_COLOR, fontSize: 11 }, show: true };
  }) : [{ type: "value", splitLine: { lineStyle: { color: SPLIT } }, axisLabel: { color: AXIS_COLOR, fontSize: 11 } }];
  return {
    tooltip: baseTooltip(), legend: baseLegend(),
    grid: { left: 52, right: 56, top: 34, bottom: 26 },
    xAxis: { type: "category", data: x, axisLine: { lineStyle: { color: SPLIT } }, axisLabel: { color: AXIS_COLOR, fontSize: 10 } },
    yAxis: yAxis, series: s
  };
}
function barOpt(x, vals, opt) {
  opt = opt || {};
  var isH = opt.horizontal;
  return {
    tooltip: baseTooltip(),
    grid: { left: isH ? 76 : 44, right: 40, top: 24, bottom: 26 },
    xAxis: isH ? { type: "value", splitLine: { lineStyle: { color: SPLIT } }, axisLabel: { color: AXIS_COLOR, fontSize: 11 } } : { type: "category", data: x, axisLine: { lineStyle: { color: SPLIT } }, axisLabel: { color: AXIS_COLOR, fontSize: 10, interval: opt.interval != null ? opt.interval : 0 } },
    yAxis: isH ? { type: "category", data: x, axisLine: { lineStyle: { color: SPLIT } }, axisLabel: { color: AXIS_COLOR, fontSize: 11 } } : { type: "value", splitLine: { lineStyle: { color: SPLIT } }, axisLabel: { color: AXIS_COLOR, fontSize: 11 } },
    series: [{ type: "bar", data: vals, barWidth: opt.barWidth || "48%", itemStyle: { color: { type: "linear", x: isH ? 1 : 0, y: isH ? 0 : 1, x2: isH ? 0 : 0, y2: isH ? 0 : 0, colorStops: [{ offset: 0, color: "#1d4ed8" }, { offset: 1, color: "#38bdf8" }] }, borderRadius: isH ? [0, 6, 6, 0] : [3, 3, 0, 0] }, label: opt.label ? { show: true, position: isH ? "right" : "top", color: "#dbeafe", fontSize: 11, formatter: function (p) { return fmt(p.value); } } : { show: false } }]
  };
}
function pieOpt(data, colors) {
  return {
    tooltip: { trigger: "item", backgroundColor: "rgba(9,20,42,.9)", borderColor: "rgba(64,128,255,.4)", textStyle: { color: "#e2e8f0", fontSize: 12 }, formatter: "{b}: {c} ({d}%)" },
    legend: { bottom: 0, textStyle: { color: AXIS_COLOR, fontSize: 11 } },
    series: [{ type: "pie", radius: ["28%", "58%"], center: ["50%", "44%"], label: { color: AXIS_COLOR, fontSize: 11, formatter: "{b} {d}%" }, data: data, color: colors || ["#38bdf8", "#f87171", "#34d399", "#fbbf24", "#a78bfa", "#f472b6"], itemStyle: { borderColor: "#0b1830", borderWidth: 2 } }]
  };
}

/* ================= 数据加载 ================= */
var FILES = [
  "data/api_overview_summary.json", "data/api_overview_device-dimension.json",
  "data/api_overview_city-dimension.json", "data/api_overview_finance-dimension.json",
  "data/api_overview_monthly-trend.json", "data/api_overview_regions.json",
  "data/api_bigscreen_summary.json", "data/api_bigscreen_trend.json",
  "data/api_bigscreen_top-cities.json", "data/api_bigscreen_regions.json",
  "data/api_bigscreen_cities.json", "data/api_bigscreen_dist.json",
  "data/api_users_summary.json", "data/api_users_growth.json", "data/api_users_lifecycle.json",
  "data/api_users_tier.json", "data/api_users_city-detail.json",
  "data/api_sales_summary.json", "data/api_sales_site-rank.json",
  "data/api_sites_summary.json",
  "data/api_assets_summary.json", "data/api_assets_battery-status.json",
  "data/api_coupons_summary.json",
  "data/api_dashboard_summary.json", "data/api_dashboard_customer-stats.json", "data/api_dashboard_alarm-stats.json",
  "data/api_staff_summary.json",
  "data/api_finance_summary.json", "data/api_finance_income-trend.json", "data/api_finance_expense-types.json",
  "data/api_insights_battery-age.json", "data/api_insights_exchange-peak.json",
  "data/api_insights_expense-compare.json", "data/api_insights_first-take.json"
];
var D = {};
function loadAll() {
  return Promise.all(FILES.map(function (f) {
    return fetch(f).then(function (r) { return r.json(); }).then(function (j) {
      D[f.split("/").pop().replace(/\.json$/, "")] = j.data || j;
    }).catch(function () { D[f.split("/").pop().replace(/\.json$/, "")] = null; });
  }));
}
function g(name) { return D[name] || {}; }

/* ================= 菜单 ================= */
var MENUS = [
  { key: "bigscreen", name: "数据大屏", icon: "📊" },
  { key: "overview", name: "数据总览", icon: "📈", children: [
    { key: "ops-overview", name: "运营总览" }, { key: "city-dim", name: "城市维度" },
    { key: "site-dim", name: "网点维度" }, { key: "device-dim", name: "设备维度" },
    { key: "finance-dim", name: "财务维度" }, { key: "exchange-heat", name: "换电密集分布" },
    { key: "user-bike-heat", name: "用户车辆密集分布" }
  ]},
  { key: "user", name: "用户看板", icon: "👥", children: [
    { key: "user-overview", name: "用户数据总览" }, { key: "user-growth", name: "增长分析" },
    { key: "user-map", name: "用户分布地图" }, { key: "user-tier", name: "用户分层" },
    { key: "user-detail", name: "单用户视图" }, { key: "user-tables", name: "用户基本表" },
    { key: "user-query", name: "实时全量查询" }
  ]},
  { key: "sales", name: "销售看板", icon: "💰", children: [
    { key: "sales-overview", name: "销售总览" }, { key: "sales-site", name: "网点销售情况" },
    { key: "sales-staff", name: "业务销售业绩" }, { key: "sales-package", name: "套餐购买明细" },
    { key: "sales-agreement", name: "协议签约明细" }, { key: "sales-site-list", name: "名下网点列表" }
  ]},
  { key: "site", name: "网点看板", icon: "🏪", children: [
    { key: "site-overview", name: "网点总览" }, { key: "site-statement", name: "网点收支对账单" },
    { key: "site-eval", name: "网点评估与发展" }, { key: "site-tables", name: "网点基本表" },
    { key: "site-sales", name: "网点销售业绩" }, { key: "site-detail", name: "单网点视图" }
  ]},
  { key: "asset", name: "设备资产看板", icon: "🔋", children: [
    { key: "asset-exchange", name: "换电柜" }, { key: "asset-battery", name: "电池" },
    { key: "asset-bike", name: "车辆" }, { key: "asset-warehouse", name: "仓库" },
    { key: "asset-flow", name: "流通" }, { key: "asset-transfer", name: "调拨" },
    { key: "asset-inout", name: "出入库" }, { key: "asset-fault", name: "故障" }
  ]},
  { key: "coupon", name: "优惠券看板", icon: "🎟️" },
  { key: "ops", name: "运维看板", icon: "🛠️", children: [
    { key: "dashboard", name: "设备总览看板" }, { key: "exchange", name: "换电柜管理" },
    { key: "battery", name: "电池管理" }, { key: "alarm", name: "设备预警" }
  ]},
  { key: "staff", name: "人员看板", icon: "🧑‍💼" },
  { key: "finance", name: "财务看板", icon: "💳" },
  { key: "service-desk", name: "客服服务台", icon: "📞" },
  { key: "deep-analysis", name: "深度分析", icon: "🔍" },
  { key: "risk-monitor", name: "风险监控", icon: "⚠️" },
  { key: "decision", name: "经营决策", icon: "🧭" },
  { key: "command", name: "大屏指挥", icon: "🖥️" }
];
var PAGE_TITLE = {};
MENUS.forEach(function (m) {
  PAGE_TITLE[m.key] = m.name;
  if (m.children) m.children.forEach(function (c) { PAGE_TITLE[c.key] = m.name + " / " + c.name; });
});
function renderMenu() {
  var html = "";
  MENUS.forEach(function (m) {
    if (m.children) {
      html += '<div class="menu-group"><div class="menu-group-title">' + m.name + '</div>';
      m.children.forEach(function (c) {
        html += '<div class="menu-item" data-key="' + c.key + '"><span class="icon">' + m.icon + '</span><span class="txt">' + c.name + '</span></div>';
      });
      html += "</div>";
    } else {
      html += '<div class="menu-item" data-key="' + m.key + '"><span class="icon">' + m.icon + '</span><span class="txt">' + m.name + '</span></div>';
    }
  });
  $id("menu").innerHTML = html;
  $id("menu").addEventListener("click", function (e) {
    var el = e.target.closest(".menu-item");
    if (el) switchPage(el.getAttribute("data-key"));
  });
}
function switchPage(key) {
  document.querySelectorAll(".menu-item").forEach(function (el) {
    el.classList.toggle("active", el.getAttribute("data-key") === key);
  });
  $id("pageTitle").innerHTML = PAGE_TITLE[key] || "看板";
  var fn = ROUTES[key] || ROUTES.placeholder;
  fn();
  window.scrollTo(0, 0);
}

/* ================= 板块渲染 ================= */
var ROUTES = {};

ROUTES.bigscreen = function () {
  var s = g("api_bigscreen_summary");
  var c = $id("content");
  c.innerHTML =
    '<div class="kpi-grid">' + kpiHTML([
      { label: "累计用户", value: fmt(s.total_users), unit: "人", trend: "今日新增 " + fmt(s.today_new_users), cls: "" },
      { label: "电池总数", value: fmt(s.battery_total), unit: "块", trend: "换电柜 " + fmt((s.exchanges && s.exchanges.total) || "-") + " 台", cls: "k2" },
      { label: "今日换电", value: fmt(s.today_exchange), unit: "次", trend: "今日营收 ¥" + fmtMoney(s.today_fee), cls: "k3" },
      { label: "当月营收", value: "¥" + fmtMoney(s.month_income), unit: "", trend: "目标完成率 " + (s.month_target_rate != null ? s.month_target_rate + "%" : pct(s.month_income, s.month_target)), cls: "k4" }
    ]) + '</div>' +
    '<div class="grid">' + chartPanel("运营趋势", "近 12 个月换电次数与营收", "bsTrend") +
    chartPanel("城市排行 TOP5", "近 30 天换电次数", "bsTop", "col-6 chart-sm") + '</div>' +

ROUTES["site-eval"] = function () {
  var rows = siteRankRows(g("api_sales_site-rank"));
  var maxCnt = Math.max.apply(null, rows.map(function (r) { return r.exchange_count; }));
  var maxAct = Math.max.apply(null, rows.map(function (r) { return r.active_users; }));
  var maxPft = Math.max.apply(null, rows.map(function (r) { return r.profit_fee; }));
  var scored = rows.map(function (r) {
    var score = (r.exchange_count / maxCnt) * 50 + (r.active_users / maxAct) * 30 + (r.profit_fee / maxPft) * 20;
    return { site: r.site, score: Math.round(score * 10) / 10, exchange_count: r.exchange_count, active_users: r.active_users, profit_fee: r.profit_fee };
  }).sort(function (a, b) { return b.score - a.score; });
  var c = $id("content");
  c.innerHTML =
    '<div class="kpi-grid">' + kpiHTML([
      { label: "评估网点数", value: fmt(scored.length), unit: "个", trend: "综合评分 TOP20", cls: "" },
      { label: "评分 TOP1", value: scored.length ? scored[0].score : "-", unit: "分", trend: scored.length ? scored[0].site : "-", cls: "k4" }
    ]) + '</div>' +
    '<div class="grid">' + panel("网点综合评分 TOP 榜", "评分 = 换电次数×50% + 活跃用户×30% + 利润×20%（各自按最大值归一化）· 站点名称已脱敏", '<div class="scroll-tbl">' + tableHTML(["排名", "网点", "综合评分", "换电次数", "活跃用户", "利润"], scored.map(function (r, i) { return [i + 1, r.site, r.score, fmt(r.exchange_count), fmt(r.active_users), "¥" + fmtMoney(r.profit_fee)]; })) + '</div>', "col-12") + '</div>';
};
