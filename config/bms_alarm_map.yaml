# 6 类电池 BMS 告警 —— 物联网库故障位映射表
# ------------------------------------------------------------------
# 数据源：dudubox-online.bms_monitor_message（电池 BMS 实时上报，字段 base_datetime / sn / bms_fault1~5）
# 位标志：bms_faultN 的第 M 位 = "N.M"（N=故障组 1~5，M=位号 0~7）
#
# 说明：物联网库以位标志存储故障，无中文明文；下表为按遥测特征（SOC/单体电压/单体温度/工况）
#      逐位比对后的候选映射，未经厂商 BMS 协议文档确认。修正方式：改本文件的 bits 即可，服务热生效。
#      confidence：high=特征与语义高度吻合；mid=特征吻合但存在歧义；todo=位定义待确认
# ------------------------------------------------------------------
source:
  db: dudubox-online
  collection: bms_monitor_message
  time_field: base_datetime

classes:
  - name: 软件单体严重过放保护
    bits: ["1.3"]
    confidence: high
    evidence: "命中 367 块电池；95% 记录 SOC=0，单体最低压 0~2.5V（138 块低于 2.5V），深度亏电特征明确"

  - name: 单体电芯过充
    bits: ["1.0", "1.1"]
    confidence: mid
    evidence: "命中 20 块电池；最高单体压超 4.2V（1.0 组 18 块、1.1 组 17 块），单体温度正常 19~40℃，符合过压/过充类"

  - name: 软件电芯热扩散告警
    bits: ["3.2", "3.3"]
    confidence: mid
    evidence: "命中 4 块电池，两位置 100% 共现；最高单体温度 84.9~125.0℃，为全库温度最高簇，符合热扩散级联特征"

  - name: 软件放电高温保护
    bits: ["4.6"]
    confidence: mid
    evidence: "命中 4 块电池；最高单体温度恒为 125.0℃，且 3 块与 3.2/3.3 同批出现，属高温保护动作档"

  - name: 高温预警
    bits: ["4.0"]
    confidence: mid
    evidence: "命中 25 块电池；最高单体温度落在 40~80℃ 预警带（1 块 60~80℃、2 块 40~60℃），其余为离线/无效采样"

  - name: 软件充电高温保护
    bits: ["3.7"]
    confidence: todo
    evidence: "命中 29 块电池；位内样本温度/电压混杂（25 块 <40℃、2 块 ≥100℃），位定义待厂商协议或物联网平台确认"
